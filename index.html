<!doctype html>
<html lang="fr" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetsuBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Browser preview outside Tauri: ?core=<url> pins the core service URL BEFORE the bridge loads
         (otherwise it would fall back to the mock). -->
    <script>
      (function () {
        try {
          var themes = ["dark", "midnight", "blue", "light", "soft-light"];
          var theme = localStorage.getItem("nr-theme");
          document.documentElement.setAttribute("data-theme", themes.indexOf(theme) >= 0 ? theme : "dark");
          var p = new URLSearchParams(location.search);
          var core = p.get("core");
          if (core) window.__NR_CORE__ = core;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
